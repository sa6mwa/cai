<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CAI kanban</title>
<link rel="stylesheet" href="style.css">
<header><h1 id="board">CAI kanban</h1><p id="status" role="status">Loading…</p></header>
<main aria-label="Kanban board">
  <section><h2>Todo <span id="todo-count"></span></h2><div id="todo"></div></section>
  <section><h2>In progress <span id="in_process-count"></span></h2><div id="in_process"></div></section>
  <section><h2>Done <span id="done-count"></span></h2><div id="done"></div></section>
</main>
<noscript>JavaScript is required for automatic updates.</noscript>
<script src="app.js" defer></script>
</html>
